<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KOC Hub · SO5 Đà Nẵng</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#fdf6f0; --cream:#fbf1e6; --surface:#ffffff; --ink:#1f2937; --muted:#94a3b8; --soft:#475569;
  --line:#f0e6dc; --line2:#ede2d4;
  --accent:#ff5a36; --accent2:#ff8a5b; --accent-soft:#ffe7dd; --accent-bg:#fff1eb;
  --green:#047857; --green-soft:#dcfce7;
  --shadow: 0 4px 18px rgba(31,41,55,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* ===== Sidebar ===== */
.sb{background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;gap:10px;align-items:center;padding:6px 10px 14px;border-bottom:1px solid var(--line)}
.sb-brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1f2937,#374151);color:#fff;display:grid;place-items:center;font-size:18px}
.sb-brand-title{font-weight:800;font-size:15px}
.sb-brand-sub{color:var(--muted);font-size:12px;margin-top:1px}

.sb-section{display:grid;gap:2px;margin-top:10px}
.sb-section-title{font-size:10.5px;color:#a1a1aa;font-weight:800;letter-spacing:.08em;padding:6px 12px 4px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:#4b5563;cursor:pointer;transition:.15s}
.sb-item .ico{width:18px;text-align:center;font-size:14px;opacity:.85}
.sb-item:hover{background:var(--accent-bg);color:var(--accent)}
.sb-item.active{background:var(--accent-bg);color:var(--accent);font-weight:800}
.sb-item.active .ico{opacity:1}

.sb-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.sb-user-mark{width:34px;height:34px;border-radius:10px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:800}
.sb-user-name{font-weight:800;font-size:13.5px}
.sb-user-role{color:var(--muted);font-size:11.5px}
.sb-user-logout{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;color:#64748b}

/* ===== Main ===== */
.main{padding:26px 30px 60px;min-width:0}
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.page-head-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#1f2937,#374151);color:#fff;display:grid;place-items:center;font-size:18px}
.page-title{font-size:24px;font-weight:900;margin:0;line-height:1.1}
.page-sub{color:var(--muted);font-size:13px;margin-top:2px}

.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:#475569;transition:.15s}
.chip:hover{border-color:#1f2937;color:#1f2937}
.chip.active{background:#1f2937;color:#fff;border-color:#1f2937}
.date-input,.select-input{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#334155;font-family:inherit}
.filter-arrow{color:var(--muted);font-weight:700}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.kpi-label{font-size:12.5px;color:#64748b;font-weight:700;margin-bottom:8px}
.kpi-value{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.5px}
.kpi-value .unit{font-size:14px;color:var(--muted);font-weight:700;margin-left:4px}
.kpi-value.gmv{color:var(--accent)}
.kpi-hint{margin-top:8px;font-size:12.5px;color:var(--accent);font-weight:600}

/* Panel */
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.panel.no-pad{padding:0;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.panel-title{font-size:15px;font-weight:800;margin:0}
.grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:18px}

.chart-svg{width:100%;height:auto;display:block}
.chart-axis{font-size:11px;fill:#94a3b8;font-family:inherit}

.donut-wrap{display:flex;gap:24px;align-items:center;justify-content:center;padding:6px 0 18px}
.donut-legend{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:13px;color:#475569;font-weight:600}
.donut-legend li{display:flex;align-items:center;gap:8px}
.donut-legend .dot{width:10px;height:10px;border-radius:50%}

/* Tables */
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:920px;font-size:13.5px}
.tbl th{background:#fafbfc;color:#94a3b8;text-align:left;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 16px;border-bottom:1px solid #f5f5f4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fffaf6}

.prod-pill{display:inline-block;padding:3px 10px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700}
.tier-pill{display:inline-block;padding:3px 10px;border-radius:8px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:700}
.member-name{color:var(--accent);font-weight:700}
.win-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,#ff7a45,#ff5a36);color:#fff;font-size:11.5px;font-weight:800}
.status-ok{color:var(--green);font-weight:800;font-size:13px}
.muted-text{color:var(--muted);font-size:12.5px}
.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;color:#475569}

/* Stage pills */
.stage{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800}
.s-tu_choi{background:#fef2f2;color:#b91c1c}
.s-cho_lh{background:#fff7ed;color:#c2410c}
.s-da_lh{background:#eff6ff;color:#1d4ed8}
.s-cho_ht{background:#fffbeb;color:#a16207}
.s-da_chot{background:var(--accent-bg);color:var(--accent)}

/* Status pills (booking) */
.st{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800}
.st-aired{background:#ecfeff;color:#0e7490}
.st-WIN{background:linear-gradient(90deg,#ff7a45,#ff5a36);color:#fff}
.st-HIEU_QUA{background:#dcfce7;color:#047857}
.st-NUOI{background:#dbeafe;color:#1d4ed8}
.st-TEST{background:#ede9fe;color:#6d28d9}
.st-DUNG{background:#fee2e2;color:#b91c1c}
.st-SPAM{background:#f1f5f9;color:#64748b}

/* Lead toolbar */
.lead-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search-box{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px}
.search-box input{border:0;outline:0;flex:1;font-size:13.5px;background:transparent}
.btn-soft{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:#475569}
.btn-soft.sm{padding:5px 10px;font-size:12px}
.btn-primary{border:0;background:linear-gradient(90deg,#ff7a45,#ff5a36);color:#fff;border-radius:10px;padding:8px 16px;font-size:13.5px;font-weight:800;box-shadow:0 4px 12px rgba(255,90,54,.28)}
.btn-action{border:0;background:linear-gradient(90deg,#ff7a45,#ff5a36);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:800}
.btn-x{border:1px solid #fecaca;background:#fff;color:#b91c1c;border-radius:8px;width:28px;height:28px;font-size:12px}
.row-actions{display:flex;gap:6px;align-items:center}

.stage-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.stage-tab{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:#475569;display:inline-flex;align-items:center;gap:6px}
.stage-tab:hover{border-color:#1f2937}
.stage-tab.active{background:#1f2937;color:#fff;border-color:#1f2937}
.stage-tab .cnt{color:#94a3b8;font-weight:700;font-size:11.5px}
.stage-tab.active .cnt{color:#fff;opacity:.7}

.coming-soon{padding:60px 20px;text-align:center;color:var(--muted)}
.coming-soon h2{margin:8px 0;font-size:18px;color:#475569}

@media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}.sb{position:static;height:auto}}
</style>
</head>

const vnd = v => v.toLocaleString("vi-VN") + "đ";
const tr = v => (v/1_000_000).toLocaleString("vi-VN",{maximumFractionDigits:1});

function areaChartSVG(arr){
  const W=640,H=240,PX=36,PT=20,PB=36,MAX=60;
  const step=(W-PX*2)/(arr.length-1);
  const pts=arr.map((d,i)=>({x:PX+i*step,y:H-PB-(d.v/MAX)*(H-PT-PB),...d}));
  const path=pts.map((p,i)=>(i?"L":"M")+p.x+","+p.y).join(" ");
  const area=path+` L${pts[pts.length-1].x},${H-PB} L${pts[0].x},${H-PB} Z`;
  const ticks=[0,15,30,45,60];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg">
    <defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff6b4a" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#ff6b4a" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>{const y=H-PB-(t/MAX)*(H-PT-PB);return `<line x1="${PX}" x2="${W-8}" y1="${y}" y2="${y}" stroke="#f0e6dc"/><text x="${PX-8}" y="${y+4}" text-anchor="end" class="chart-axis">${t}</text>`}).join("")}
    <path d="${area}" fill="url(#g1)"/>
    <path d="${path}" fill="none" stroke="#ff5a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#fff" stroke="#ff5a36" stroke-width="2"/><text x="${p.x}" y="${H-12}" text-anchor="middle" class="chart-axis">${p.w}</text>`).join("")}
  </svg>`;
}

function donutSVG(arr){
  const total=arr.reduce((s,d)=>s+d.value,0);
  const R=85,r=56,CX=110,CY=110;
  let acc=0;
  const segs=arr.map(d=>{
    const s=acc/total; acc+=d.value; const e=acc/total;
    const a0=s*Math.PI*2-Math.PI/2,a1=e*Math.PI*2-Math.PI/2;
    const lg=e-s>0.5?1:0;
    const x0=CX+R*Math.cos(a0),y0=CY+R*Math.sin(a0);
    const x1=CX+R*Math.cos(a1),y1=CY+R*Math.sin(a1);
    const x2=CX+r*Math.cos(a1),y2=CY+r*Math.sin(a1);
    const x3=CX+r*Math.cos(a0),y3=CY+r*Math.sin(a0);
    return `<path d="M${x0},${y0} A${R},${R} 0 ${lg} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${lg} 0 ${x3},${y3} Z" fill="${d.color}"/>`;
  }).join("");
  return `<div class="donut-wrap">
    <svg viewBox="0 0 220 220" width="220" height="220">${segs}</svg>
    <ul class="donut-legend">${arr.map(d=>`<li><span class="dot" style="background:${d.color}"></span>${d.name}</li>`).join("")}</ul>
  </div>`;
}

function renderHead(icon,title,sub){
  return `<div class="page-head"><div class="page-head-icon">${icon}</div><div><h1 class="page-title">${title}</h1><div class="page-sub">${sub}</div></div></div>`;
}

    <div class="panel"><div class="panel-head"><h3 class="panel-title">GMV theo nhân sự (triệu)</h3></div>${donutSVG(o.gmvByMember)}</div>

  <div class="panel">
    <div class="panel-head"><h3 class="panel-title">🏆 Top KOC Win</h3><span class="muted-text">Xếp theo GMV trong kỳ</span></div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>#</th><th>KOC</th><th>Sản phẩm</th><th>Đơn</th><th>GMV</th><th></th></tr></thead>
      <tbody>${o.topWin.map(r=>`<tr>
        <td><strong>${r.rank}</strong></td>
        <td><strong>${r.koc}</strong></td>
        <td><span class="prod-pill">${r.product}</span></td>
        <td>${r.orders.toLocaleString("vi-VN")}</td>
        <td><strong>${vnd(r.gmv)}</strong></td>
        <td>${r.status==="WIN"?'<span class="win-badge">WIN 🔥</span>':""}</td>
      </tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}

function renderLeads(){
  const tabs=[
    {k:"all",l:"Tất cả"},{k:"cho_lh",l:"Chờ duyệt liên hệ"},
    {k:"da_lh",l:"Đã duyệt — đang liên hệ"},{k:"cho_ht",l:"Chờ duyệt hợp tác"},
    {k:"da_chot",l:"Đã chốt → Booking"}
  ];
  const cnt=k=>k==="all"?data.leads.length:data.leads.filter(l=>l.stage===k).length;
  return `
  ${renderHead("👥","KOC Lead → Deal","Member nhập → admin duyệt liên hệ → liên hệ → gửi duyệt hợp tác → admin duyệt → Booking")}
  <div class="lead-toolbar">
    <div class="search-box"><span>🔎</span><input placeholder="Tìm KOC..."/></div>
    <button class="btn-soft">⬆ Import Excel</button>
    <button class="btn-primary">+ Nhập KOC</button>
  </div>
  <div class="stage-tabs">
    ${tabs.map(t=>`<button class="stage-tab ${t.k==="all"?"active":""}">${t.l} <span class="cnt">(${cnt(t.k)})</span></button>`).join("")}
  </div>
  <div class="panel no-pad"><div class="table-wrap"><table class="tbl">
    <thead><tr><th>KOC</th><th>Sản phẩm</th><th>Tier</th><th>Follow</th><th>Member</th><th>Giai đoạn</th><th>Cast</th><th>Video</th><th>Hàng mẫu</th><th>Thao tác</th></tr></thead>
    <tbody>${data.leads.map(l=>`<tr>
      <td><div><strong>${l.koc}</strong></div><div class="muted-text">${l.sub}</div></td>
      <td><span class="prod-pill">${l.product}</span></td>
      <td><span class="tier-pill">${l.tier}</span></td>
      <td>${l.follow||"—"}</td>
      <td><span class="member-name">${l.member}</span></td>
      <td><span class="stage s-${l.stage}">${l.stageLabel}</span></td>
      <td>${l.cast||"—"}</td>
      <td>${l.video||"—"}</td>
      <td class="muted-text">${l.sample||"—"}</td>
      <td>${
        l.stage==="cho_ht"?'<div class="row-actions"><button class="btn-action">Duyệt → Booking</button><button class="btn-x">✕</button></div>'
        :l.stage==="da_chot"?'<span class="status-ok">✓ Đã vào Booking</span>'
        :l.stage==="da_lh"?'<button class="btn-soft sm">↗ Gửi duyệt hợp tác</button>'
        :'<span class="muted-text">—</span>'
      }</td>
    </tr>`).join("")}</tbody>
  </table></div></div>`;
}

function renderBookings(){
  const tabs=["Tất cả","WIN","HIỆU QUẢ","NUÔI","TEST","DỪNG","SPAM"];
  const totalGmv=data.bookings.reduce((s,b)=>s+b.gmv,0);
  const aired=data.bookings.filter(b=>b.aired).length;
  return `
  ${renderHead("📋","Booking Log","Quyết định KOC tự tính theo đơn/tuần & đơn/video (như công thức gốc)")}
  <div class="filter-row">${tabs.map((t,i)=>`<button class="chip ${i===0?"active":""}">${t}</button>`).join("")}</div>
  <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="kpi-label">Tổng booking</div><div class="kpi-value">${data.bookings.length}</div></div>
    <div class="kpi"><div class="kpi-label">Tổng GMV</div><div class="kpi-value gmv">${tr(totalGmv)}<span class="unit">triệu</span></div></div>
    <div class="kpi"><div class="kpi-label">Đã air</div><div class="kpi-value">${aired}</div></div>
  </div>
  <div class="panel no-pad"><div class="table-wrap"><table class="tbl" style="min-width:1400px">
    <thead><tr>
      <th>KOC</th><th>Sản phẩm</th><th>Tier</th><th>Thời gian vào</th>
      <th>Ngày duyệt</th><th>Ngày book</th><th>Status</th><th>Video</th>
      <th>Tổng đơn</th><th>Đơn/tuần</th><th>Đơn/video</th><th>GMV</th>
      <th>Quyết định</th><th>Hành động</th><th>Member</th>
    </tr></thead>
    <tbody>${data.bookings.map(b=>`<tr>
      <td><div><strong>${b.koc}</strong></div>${b.sub?`<div class="muted-text">${b.sub}</div>`:""}</td>
      <td><span class="prod-pill">${b.product}</span></td>
      <td><span class="tier-pill">${b.tier}</span></td>
      <td class="mono">${b.enteredAt}</td>
      <td class="mono">${b.approvedAt}</td>
      <td class="mono">${b.bookedAt}</td>
      <td><span class="st st-aired">Đã air</span></td>
      <td>${b.videos}</td>
      <td><strong>${b.orders.toLocaleString("vi-VN")}</strong></td>
      <td>${b.opw}</td>
      <td>${b.opv}</td>
      <td><strong>${vnd(b.gmv)}</strong></td>
      <td><span class="st st-${b.status}">${b.statusLabel}</span></td>
      <td class="muted-text">${b.decision}</td>
      <td><span class="member-name">${b.member}</span></td>
    </tr>`).join("")}</tbody>
  </table></div></div>`;
}

function renderSoon(name){
  return `${renderHead("🚧",name||"Sắp ra mắt","Module đang xây dựng")}<div class="panel coming-soon"><h2>🚧 Module đang phát triển</h2><div>Sẽ kết nối Supabase và mở khoá sớm.</div></div>`;
}

function go(key,el){
  document.querySelectorAll(".sb-item").forEach(x=>x.classList.remove("active"));
  if(el) el.classList.add("active");
  const main=document.getElementById("main");
  if(key==="overview") main.innerHTML=renderOverview();
  else if(key==="leads") main.innerHTML=renderLeads();
  else if(key==="bookings") main.innerHTML=renderBookings();
  else if(key==="reports") main.innerHTML=renderSoon("Báo cáo");
  else main.innerHTML=renderSoon("Sắp ra mắt");
  window.scrollTo({top:0,behavior:"instant"});
}

document.querySelectorAll(".sb-item").forEach(el=>{
  el.addEventListener("click",()=>go(el.dataset.go,el));
});
go("overview",document.querySelector('.sb-item[data-go="overview"]'));
</script>
</body>
</html>
